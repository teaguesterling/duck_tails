#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-next-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: false
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: duck_tails
      # wasm: libgit2 (the extension's core dependency) has no wasm build.
      # windows_amd64(_mingw): DuckDB's vendored fmt fails to compile against
      # the Windows runner's MSVC STL here (stdext::checked_array_iterator
      # removed); the community-extensions build environment compiles Windows
      # fine, so the binary is still published there (matches the webbed setup).
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw'

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.3
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: duck_tails
      # See note above: exclude wasm (no libgit2) and Windows (MSVC fmt build).
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.3
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: duck_tails
      # Note: tidy requires libgit2 which isn't available in the code quality runner
      format_checks: 'format'
